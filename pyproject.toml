[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qorovul"
dynamic = ["version"]
description = "Lightweight Linux server watchdog that sends alerts to Telegram"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["monitoring", "watchdog", "telegram", "systemd", "alerting"]
classifiers = [
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PyYAML>=5.1",
    "requests>=2.20",
    "psutil>=5.6",
]

[project.optional-dependencies]
test = ["pytest>=6"]

[project.scripts]
qorovul = "qorovul.__main__:main"

[project.urls]
Homepage = "https://github.com/Qoshmurod/Security-"

[tool.setuptools]
packages = ["qorovul", "qorovul.checks", "qorovul.locales"]

[tool.setuptools.dynamic]
version = { attr = "qorovul.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
